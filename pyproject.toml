[project]
name = "neurodec"
version = "0.1.0"
description = "Neural decoder for a black-box low-bitrate speech codec (PoC)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyyaml>=6.0",
  "tensorboard>=2.15",
  "pesq>=0.0.4",
  "pystoi>=0.4",
  "pyworld>=0.3.4",
  "setuptools<81",  # pyworld still imports pkg_resources
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurodec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the ambe2-c binaries or takes long"]
